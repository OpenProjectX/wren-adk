name: order_items
table_reference:
  catalog: ''
  schema: wrenai
  table: order_items
columns:
- name: order_item_id
  type: INT
  not_null: true
- name: order_id
  type: INT
  not_null: true
- name: product_id
  type: INT
  not_null: true
- name: quantity
  type: INT
  not_null: true
- name: unit_price
  type: DECIMAL(10, 2)
  not_null: true
- name: discount_pct
  type: DECIMAL(5, 4)
  not_null: true
  properties:
    description: Fractional discount, 0.10 = 10% off.
- name: line_total
  type: DECIMAL(12, 2)
  not_null: true
  properties:
    description: quantity * unit_price * (1 - discount_pct), USD.
primary_key: order_item_id
properties:
  description: Line items belonging to an order.
