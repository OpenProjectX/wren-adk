# Ready-to-run local profile.
#
#   ./gradlew :app:bootRun --args='--spring.profiles.active=local'
#
# Assumes:
#   - the `wren` CLI is installed (pip install wrenai) — absolute path below,
#     because the JVM does not inherit a login shell's PATH
#   - a built Wren project at wren.adk.mcp.project-home (models/, target/mdl.json)
#   - a connection profile bound to it (`wren context set-profile <name>`), so
#     warehouse credentials come from ~/.wren/profiles.yml, not from here
#   - .env supplies the LLM credentials (see .env.example)
#
# Everything below can be overridden by an environment variable of the same
# name, so this file holds paths and preferences — never secrets.

server:
  port: ${PORT:8080}

adk:
  agents:
    loader: static

wren:
  adk:
    provider: ${env.LLM_PROVIDER:${LLM_PROVIDER:ANTHROPIC}}
    model: ${WREN_ADK_MODEL:${env.ANTHROPIC_MODEL:${ANTHROPIC_MODEL:}}}
    agent-name: wren_analyst

    # Read-only: the store_query write tool stays hidden, so a local session
    # cannot write NL->SQL pairs back into the project by accident.
    read-only: true

    # Registers ADK's LoggingPlugin. NOTE: on ADK 1.8.0 it emits nothing through
    # the Dev UI path (verified at TRACE, bean present). The useful tracing
    # comes from the log levels below. Kept enabled locally so it starts working
    # the moment ADK invokes plugin callbacks there.
    verbose: true

    anthropic:
      api-key: ${env.ANTHROPIC_API_KEY:${ANTHROPIC_API_KEY:}}
      auth-token: ${env.ANTHROPIC_AUTH_TOKEN:${ANTHROPIC_AUTH_TOKEN:}}
      base-url: ${env.ANTHROPIC_BASE_URL:${ANTHROPIC_BASE_URL:}}
      max-tokens: 8192
      # Compatible gateways often return `thinking` blocks, which ADK cannot
      # parse. Leave on unless your endpoint never emits them.
      disable-thinking: true

    skills:
      enabled: true
      names: [usage]
      command: ${env.WREN_CLI:${WREN_CLI:/home/coder/.local/bin/wren}}

    mcp:
      # Spawns the CLI as a child process — no port, nothing on the network,
      # and the process dies with the Spring context.
      transport: STDIO
      command: ${env.WREN_CLI:${WREN_CLI:/home/coder/.local/bin/wren}}
      args: [serve, mcp]
      project-home: ${env.WREN_PROJECT_HOME:${WREN_PROJECT_HOME:/data/Git/WrenAI-demo}}

logging:
  level:
    root: INFO

    # --- what the agent decided -------------------------------------------
    # THE trace. `Claude` logs each model response; `BaseLlmFlow` logs the event
    # it becomes, including the tool the model chose and its arguments, e.g.
    #   functionCalls: [FunctionCall{id=toolu_..., name=run_sql,
    #                   args={sql=SELECT COUNT(*) AS order_count FROM orders}}]
    com.google.adk.models: DEBUG
    com.google.adk.flows.llmflows: DEBUG

    # ADK's LoggingPlugin lives here. Silent on 1.8.0 via the Dev UI; left at
    # DEBUG so it appears if that changes.
    com.google.adk.plugins: DEBUG
    com.google.adk.runner: DEBUG
    com.google.adk.tools: DEBUG

    # --- the wire ----------------------------------------------------------
    # JSON-RPC to and from `wren serve mcp`, and the tool list it advertises.
    io.modelcontextprotocol: DEBUG
    # Anthropic SDK: status and timing. It does not log bodies, so the token
    # is not exposed here.
    com.anthropic: DEBUG

    # This project: MCP settings resolution, skill-guide loading.
    org.openprojectx.wren.adk: DEBUG

    # --- keep the trace readable -------------------------------------------
    org.springframework: INFO
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
