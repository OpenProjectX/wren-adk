<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren Analyst</title>
<style>
  :root{
    --bg:#f5f7f9; --panel:#fff; --ink:#131a21; --muted:#5d6a77; --line:#e1e6ec;
    --accent:#1f6f8b; --accent-soft:#e8f1f5; --tool:#7a5cc4; --tool-soft:#f0ecfa;
    --ok:#146c4c; --err:#b3392b; --code:#f2f5f8;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#0d1116; --panel:#151b22; --ink:#e5eaf0; --muted:#93a1b0; --line:#232c35;
    --accent:#5fb3d4; --accent-soft:#12242d; --tool:#a98fe6; --tool-soft:#1d1830;
    --ok:#4fc493; --err:#ff8177; --code:#101820;
  }}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:-.01em}
  .badge{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--muted)}
  .badge.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  .badge.off{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
  .spacer{flex:1}
  button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  main{flex:1;overflow-y:auto;padding:20px}
  .thread{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .msg{display:flex;gap:10px;align-items:flex-start}
  .msg .who{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    min-width:58px;padding-top:4px;flex-shrink:0}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;flex:1;min-width:0;overflow-wrap:anywhere}
  .msg.user .bubble{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
  .tool{font-size:12.5px}
  .tool .bubble{background:var(--tool-soft);border-color:color-mix(in srgb,var(--tool) 25%,transparent);
    color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .tool .name{color:var(--tool);font-weight:600}
  details{font-size:12.5px}
  details summary{cursor:pointer;color:var(--muted);padding:2px 0}
  details pre{background:var(--code);border:1px solid var(--line);border-radius:6px;
    padding:10px;overflow-x:auto;margin:6px 0 0;
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
  .err .bubble{border-color:var(--err);color:var(--err)}
  .empty{color:var(--muted);text-align:center;padding:44px 0}
  .empty h2{font-size:15px;color:var(--ink);margin:0 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .chip{font-size:13px;border:1px solid var(--line);background:var(--panel);
    border-radius:99px;padding:6px 13px;cursor:pointer;color:var(--muted)}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px}
  .composer{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;font:inherit;resize:none;border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;background:var(--bg);color:var(--ink);max-height:160px;min-height:44px}
  .dots::after{content:"";animation:d 1.4s steps(4,end) infinite}
  @keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
  @media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"..."}}
</style>
</head>
<body>
  <header>
    <h1>Wren Analyst</h1>
    <span class="badge" id="agent">connecting…</span>
    <span class="badge" id="mode"></span>
    <span class="spacer"></span>
    <button id="reset" type="button">New chat</button>
  </header>

  <main><div class="thread" id="thread">
    <div class="empty" id="empty">
      <h2>Ask a question about the data</h2>
      <div>Queries run through the Wren semantic layer — model names, not tables.</div>
      <div class="chips">
        <span class="chip">How much revenue did we make last quarter?</span>
        <span class="chip">Which channel has the best average order value?</span>
        <span class="chip">Top 5 products by revenue</span>
        <span class="chip">What's our return rate by category?</span>
      </div>
    </div>
  </div></main>

  <footer><div class="composer">
    <textarea id="input" rows="1" placeholder="Ask about revenue, products, customers…"></textarea>
    <button id="send" type="button">Send</button>
  </div></footer>

<script type="module">
const $ = id => document.getElementById(id);
const thread = $("thread"), input = $("input"), send = $("send");
let sessionId = null, busy = false;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function bubble(who, cls = "") {
  $("empty")?.remove();
  const row = document.createElement("div");
  row.className = `msg ${cls}`;
  row.innerHTML = `<div class="who">${esc(who)}</div><div class="bubble"></div>`;
  thread.appendChild(row);
  scroll();
  return row.querySelector(".bubble");
}
const scroll = () => document.querySelector("main").scrollTo({
  top: document.querySelector("main").scrollHeight, behavior: "smooth" });

async function health() {
  try {
    const h = await (await fetch("api/chat/health")).json();
    $("agent").textContent = `${h.agent} · ${h.model}`;
    $("agent").className = "badge on";
    $("mode").textContent = h.readOnly ? "read-only" : "read-write";
    $("mode").className = "badge";
  } catch {
    $("agent").textContent = "backend unreachable";
    $("agent").className = "badge off";
  }
}

async function ask(text) {
  if (busy || !text.trim()) return;
  busy = true; send.disabled = true;

  bubble("You", "user").textContent = text;
  input.value = ""; input.style.height = "auto";

  const pending = bubble("Agent");
  pending.innerHTML = '<span class="dots">Thinking</span>';
  let answered = false;

  try {
    const res = await fetch("api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ message: text, sessionId }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // Parse the SSE stream by hand: EventSource cannot issue a POST.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const frames = buf.split("\n\n");
      buf = frames.pop();
      for (const frame of frames) {
        let name = "message", data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event:")) name = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        handle(name, data, pending, () => { answered = true; });
      }
    }
    if (!answered) pending.textContent = "(no answer returned)";
  } catch (e) {
    pending.parentElement.classList.add("err");
    pending.textContent = `Could not reach the agent: ${e.message}`;
  } finally {
    busy = false; send.disabled = false; input.focus(); scroll();
  }
}

function handle(name, raw, pending, markAnswered) {
  if (name === "session") { sessionId = raw; return; }
  if (name === "done") return;

  let d; try { d = JSON.parse(raw); } catch { d = { text: raw }; }

  if (name === "tool") {
    const b = bubble("Tool", "tool");
    const names = (d.tools || []).map(n => `<span class="name">${esc(n)}</span>`).join(", ");
    b.innerHTML = names || "tool call";
    if (d.args && d.args !== "{}") {
      const det = document.createElement("details");
      det.innerHTML = `<summary>arguments</summary><pre>${esc(d.args)}</pre>`;
      b.appendChild(det);
    }
    scroll(); return;
  }

  if (name === "result") {
    const b = bubble("Data", "tool");
    b.innerHTML = `<details><summary>tool result</summary><pre>${esc(d.text)}</pre></details>`;
    scroll(); return;
  }

  if (name === "error") {
    const b = bubble("Agent"); b.parentElement.classList.add("err");
    b.textContent = d.text || raw; markAnswered(); scroll(); return;
  }

  const text = (d.text || "").trim();
  if (!text) return;
  if (pending.querySelector(".dots")) pending.textContent = "";
  pending.textContent += (pending.textContent ? "\n" : "") + text;
  markAnswered(); scroll();
}

send.addEventListener("click", () => ask(input.value));
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
});
thread.addEventListener("click", e => {
  if (e.target.classList.contains("chip")) ask(e.target.textContent);
});
$("reset").addEventListener("click", async () => {
  sessionId = null;
  thread.innerHTML = `<div class="empty" id="empty"><h2>Ask a question about the data</h2>
    <div>Queries run through the Wren semantic layer — model names, not tables.</div></div>`;
});

health();
input.focus();
</script>
</body>
</html>
