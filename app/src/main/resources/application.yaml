spring:
  application:
    name: wren-adk
  threads:
    virtual:
      enabled: true

server:
  port: 8080

wren:
  adk:
    # GEMINI (needs GOOGLE_API_KEY) or ANTHROPIC (needs ANTHROPIC_API_KEY).
    # Both keys are read from .env by spring-dotenv — see .env.example.
    provider: ${WREN_ADK_PROVIDER:ANTHROPIC}
    # Blank picks the provider's default: claude-sonnet-4-5 / gemini-2.0-flash.
    model: ${WREN_ADK_MODEL:}
    agent-name: wren_analyst
    app-name: wren-adk
    # Withhold Wren's store_query write tool. Flip only if the agent should
    # persist confirmed NL->SQL pairs back into the project.
    read-only: true
    anthropic:
      # Left blank on purpose: the SDK then reads ANTHROPIC_API_KEY from the
      # environment, so the key never has to appear in a config file.
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:}
      max-tokens: 8192
    gemini:
      api-key: ${GOOGLE_API_KEY:}
    mcp:
      # STDIO spawns `wren serve mcp` as a child process. The wrenai base image
      # puts the CLI on PATH, so nothing extra is needed and nothing listens on
      # the network. Switch to STREAMABLE_HTTP to talk to a sidecar or service.
      transport: ${WREN_ADK_TRANSPORT:STDIO}
      project-home: ${WREN_PROJECT_HOME:/project}
      url: ${WREN_MCP_URL:http://127.0.0.1:8080/mcp}

logging:
  level:
    org.openprojectx.wren.adk: INFO
